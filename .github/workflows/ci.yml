name: CI

on:
  push:
    paths:
      - 'connect.sh'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'connect.sh'
      - 'tests/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  lint:
    name: Lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SC2015 (A && B || C): flags the "kill ... || true" best-effort-kill
      # idiom in stop_ssm_session; ShellCheck 0.11+ already exempts this
      # pattern, but the runner's older shellcheck (0.9.x) still flags it.
      - run: shellcheck --exclude=SC2015 connect.sh

  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/connect_test.sh
